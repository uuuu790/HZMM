appId: com.hzmm.mod-manager
productName: HZMM Manager
directories:
  buildResources: resources
  output: dist
# Without an explicit list electron-builder defaults to "**/*", so app.asar
# shipped the entire repo — src/, tests/, e2e/, scripts/ and several MB of docs
# screenshots — none of which the packaged app loads (it runs out/).
files:
  - out/**/*
  - node_modules/**/*
  - package.json
  - '!**/*.map'
# 7za.exe must live outside app.asar to be spawnable (archive.js swaps
# app.asar -> app.asar.unpacked when resolving the binary path).
asarUnpack:
  - node_modules/7zip-bin/**
win:
  target:
    - portable
  icon: resources/icon.ico
  signAndEditExecutable: false
  artifactName: "${productName}.${ext}"
extraResources:
  - from: resources/icon.ico
    to: icon.ico
forceCodeSigning: false
